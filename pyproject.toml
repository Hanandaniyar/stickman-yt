[project]
name = "sty"
version = "0.1.0"
description = "Pipeline produksi video stickman untuk channel Economic for adults"
requires-python = ">=3.12"
dependencies = [
    "num2words>=0.5.14",
    "numpy>=2.5.4",
    "soundfile>=0.14.0",
]

[project.scripts]
sty = "sty.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
]
