<template>
  <style>
    #root { position: absolute; inset: 0; background: #FAF7F0; overflow: hidden; }
    #s21-guy { position: absolute; left: 365px; top: 266px; }
    #s21-num { position: absolute; left: 900px; top: 260px; width: 900px; text-align: center; font-size: 170px; line-height: 1.1; font-weight: 900; color: #1F9D55;  }
    #s21-lab { position: absolute; left: 900px; top: 460px; width: 900px; text-align: center; font-size: 60px; line-height: 1.1; font-weight: 800; color: #111111;  }
    #s21-cash { position: absolute; left: 700px; top: 330px; }
    #s21-title { position: absolute; left: 96px; top: 60px; width: 1728px; text-align: center; font-size: 70px; line-height: 1.1; font-weight: 900; color: #111111;  }
  </style>
  <div id="root" data-composition-id="s21" data-width="1920" data-height="1080">
    <div id="s21-guy" class="clip sm-figure" data-start="0" data-duration="30"></div>
    <div id="s21-num" class="clip sm-title" data-start="0" data-duration="30">$0</div>
    <div id="s21-lab" class="clip sm-title" data-start="0" data-duration="30">Taxable income</div>
    <div id="s21-cash" class="clip sm-prop" data-start="0" data-duration="30"></div>
    <div id="s21-title" class="clip sm-title" data-start="0" data-duration="30">Let's run the numbers</div>
  </div>
  <script>
  (function () {
    const tl = gsap.timeline({ paused: true });
    const $ = (n) => document.getElementById("s21-" + n);
    const pop = (el, at, d) => tl.fromTo(el, { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: d || 0.45, ease: "back.out(2)" }, at);
    const rise = (el, at) => tl.fromTo(el, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at);
    const fade = (el, at, d) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: d || 0.5, ease: "power1.out" }, at);
    const out = (el, at, to) => tl.fromTo(el, { opacity: 1 }, { opacity: to || 0, duration: 0.4, ease: "power1.in", immediateRender: false }, at);
    const growX = (el, at, d) => tl.fromTo(el, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: d || 0.8, ease: "power2.out" }, at);
    const growY = (el, at, d) => tl.fromTo(el, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: d || 0.8, ease: "power2.out" }, at);
    const draw = (el, at, d) => tl.fromTo(el, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d || 1, ease: "power1.inOut" }, at);
    const comma = (v) => Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    const count = (el, a, b, at, d, fmt) => { const o = { v: a }; el.textContent = fmt(a); tl.fromTo(o, { v: a }, { v: b, duration: d, ease: "power2.out", onUpdate: () => { el.textContent = fmt(o.v); } }, at); };
    const gait = (fig, at, d, run, end) => { const n = Math.max(2, Math.round(d * 3)), s = d / n; for (let i = 0; i < n; i++) Stickman.pose(tl, fig, run ? "run" : "walk", at + i * s, s, { mirror: i % 2 === 1, ease: "sine.inOut" }); return Stickman.pose(tl, fig, end || "stand", at + d, 0.2); };
    const guy = Stickman.mount($("guy"), { pose: "stand", scale: 1.55 });
    Stickman.breathe(tl, guy, 0, 30);
    const cash = Stickman.prop($("cash"), "money-stack", { size: 160 });
    rise($("title"), 0.1);
    Stickman.pose(tl, guy, "point", 1.6);
    pop(cash, 3.2);
    fade($("num"), 1.6, 0.3);
    count($("num"), 0, 51500, 1.6, 1.6, (v) => "$" + comma(v));
    fade($("lab"), 4.0);
    window.__timelines["s21"] = tl;
  })();
  </script>
</template>
