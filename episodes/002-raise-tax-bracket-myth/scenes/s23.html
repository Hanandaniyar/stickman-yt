<template>
  <style>
    #root { position: absolute; inset: 0; background: #FAF7F0; overflow: hidden; }
    #s23-guy { position: absolute; left: 325px; top: 266px; }
    #s23-raise { position: absolute; left: 860px; top: 130px; width: 720px; box-sizing: border-box; padding: 18px; background: #FFFFFF; border: 6px solid #111111; border-radius: 22px; text-align: center; font-size: 96px; line-height: 1.1; font-weight: 900; color: #111111;  }
    #s23-num { position: absolute; left: 860px; top: 420px; width: 720px; text-align: center; font-size: 140px; line-height: 1.1; font-weight: 900; color: #111111;  }
    #s23-lab { position: absolute; left: 860px; top: 580px; width: 720px; text-align: center; font-size: 50px; line-height: 1.1; font-weight: 800; color: #111111;  }
    #s23-coin { position: absolute; left: 1600px; top: 150px; }
  </style>
  <div id="root" data-composition-id="s23" data-width="1920" data-height="1080">
    <div id="s23-guy" class="clip sm-figure" data-start="0" data-duration="30"></div>
    <div id="s23-raise" class="clip sm-title" data-start="0" data-duration="30"><span class="sm-accent">+$1,000</span> raise</div>
    <div id="s23-num" class="clip sm-title" data-start="0" data-duration="30">$51,500</div>
    <div id="s23-lab" class="clip sm-title" data-start="0" data-duration="30">Taxable income</div>
    <div id="s23-coin" class="clip sm-prop" data-start="0" data-duration="30"></div>
  </div>
  <script>
  (function () {
    const tl = gsap.timeline({ paused: true });
    const $ = (n) => document.getElementById("s23-" + n);
    const pop = (el, at, d) => tl.fromTo(el, { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: d || 0.45, ease: "back.out(2)" }, at);
    const rise = (el, at) => tl.fromTo(el, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at);
    const fade = (el, at, d) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: d || 0.5, ease: "power1.out" }, at);
    const out = (el, at, to) => tl.fromTo(el, { opacity: 1 }, { opacity: to || 0, duration: 0.4, ease: "power1.in", immediateRender: false }, at);
    const growX = (el, at, d) => tl.fromTo(el, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: d || 0.8, ease: "power2.out" }, at);
    const growY = (el, at, d) => tl.fromTo(el, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: d || 0.8, ease: "power2.out" }, at);
    const draw = (el, at, d) => tl.fromTo(el, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d || 1, ease: "power1.inOut" }, at);
    const comma = (v) => Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    const count = (el, a, b, at, d, fmt) => { const o = { v: a }; el.textContent = fmt(a); tl.fromTo(o, { v: a }, { v: b, duration: d, ease: "power2.out", onUpdate: () => { el.textContent = fmt(o.v); } }, at); };
    const gait = (fig, at, d, run, end) => { const n = Math.max(2, Math.round(d * 3)), s = d / n; for (let i = 0; i < n; i++) Stickman.pose(tl, fig, run ? "run" : "walk", at + i * s, s, { mirror: i % 2 === 1, ease: "sine.inOut" }); return Stickman.pose(tl, fig, end || "stand", at + d, 0.2); };
    const guy = Stickman.mount($("guy"), { pose: "stand", scale: 1.55 });
    Stickman.breathe(tl, guy, 0, 30);
    const coin = Stickman.prop($("coin"), "coin", { size: 130 });
    pop($("raise"), 0.3);
    pop(coin, 0.5);
    Stickman.pose(tl, guy, "celebrate", 0.4, 0.35);
    fade($("num"), 2.4);
    fade($("lab"), 2.4);
    count($("num"), 51500, 52500, 3.6, 1.2, (v) => "$" + comma(v));
    tl.fromTo($("num"), { color: "#111111" }, { color: "#1F9D55", duration: 0.3, immediateRender: false }, 4.6);
    Stickman.pose(tl, guy, "point", 2.4);
    window.__timelines["s23"] = tl;
  })();
  </script>
</template>
