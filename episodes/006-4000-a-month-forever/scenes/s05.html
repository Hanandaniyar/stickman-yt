          <div id="s05-c4" class="e5-a" style="left: 690px; top: 1100px; width: 90px;"><img src="assets/emoji/coin.svg" alt=""></div>
          <div id="s05-c5" class="e5-a" style="left: 690px; top: 1100px; width: 90px;"><img src="assets/emoji/coin.svg" alt=""></div>

  <script>
  (function () {
    const tl = gsap.timeline({ paused: true });
    const $ = (n) => document.getElementById("s05-" + n);
    const popin = (el, at, rot, d) => tl.fromTo(el, { scale: 0, rotation: rot == null ? -14 : rot, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, rotation: 0, opacity: 1, duration: d || 0.42, ease: "back.out(2.6)" }, at);
    const popout = (el, at, d) => tl.fromTo(el, { scale: 1, opacity: 1 }, { scale: 0, opacity: 0, duration: d || 0.22, ease: "back.in(2)", immediateRender: false }, at);
    const fade = (el, at, d) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: d || 0.4, ease: "power1.out" }, at);
    const out = (el, at, d) => tl.fromTo(el, { opacity: 1 }, { opacity: 0, duration: d || 0.3, ease: "power1.in", immediateRender: false }, at);
    const growX = (el, at, d) => tl.fromTo(el, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: d || 0.35, ease: "power2.out" }, at);
    const bob = (el, at, n, h, p) => tl.fromTo(el, { y: 0 }, { y: -(h || 14), duration: p || 0.4, ease: "sine.inOut", yoyo: true, repeat: (n || 3) * 2 - 1, immediateRender: false }, at);
    const wob = (el, at, n, deg, p) => tl.fromTo(el, { rotation: -(deg || 8) }, { rotation: deg || 8, duration: p || 0.3, ease: "sine.inOut", yoyo: true, repeat: (n || 3) * 2 - 1, immediateRender: false }, at);
    const shake = (el, at, n, px) => tl.fromTo(el, { x: -(px || 10) }, { x: px || 10, duration: 0.05, ease: "none", yoyo: true, repeat: (n || 5) * 2 - 1, immediateRender: false }, at);
    const pulse = (el, at, k, n) => tl.fromTo(el, { scale: 1 }, { scale: k || 1.15, duration: 0.18, ease: "power2.out", yoyo: true, repeat: (n || 1) * 2 - 1, immediateRender: false }, at);
    const mv = (el, at, a, b, d, ease, first) => tl.fromTo(el, { x: a[0], y: a[1] }, { x: b[0], y: b[1], duration: d, ease: ease || "power2.inOut", immediateRender: !!first }, at);
    const scl = (el, at, a, b, d, ease) => tl.fromTo(el, { scale: a }, { scale: b, duration: d || 0.4, ease: ease || "power2.inOut", immediateRender: false, transformOrigin: "50% 50%" }, at);
    const rot = (el, at, a, b, d, ease) => tl.fromTo(el, { rotation: a }, { rotation: b, duration: d || 0.4, ease: ease || "power2.inOut", immediateRender: false }, at);
    const drop = (el, at, h, d) => tl.fromTo(el, { y: -(h || 500), opacity: 0 }, { y: 0, opacity: 1, duration: d || 0.6, ease: "bounce.out" }, at);
    const slam = (el, at, r) => tl.fromTo(el, { scale: 2.8, opacity: 0, rotation: (r || 0) - 10, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, rotation: r || 0, duration: 0.2, ease: "power3.in" }, at);
    const blink = (el, at, n, p) => tl.fromTo(el, { opacity: 0.2 }, { opacity: 1, duration: p || 0.15, ease: "none", yoyo: true, repeat: (n || 4) * 2 - 1, immediateRender: false }, at);
    const bgc = (el, at, c, c0) => tl.fromTo(el, { backgroundColor: c0 }, { backgroundColor: c, duration: 0.2, immediateRender: false }, at);
    const brc = (el, at, c, c0) => tl.fromTo(el, { borderColor: c0 || "#111111" }, { borderColor: c, duration: 0.2, immediateRender: false }, at);
    const count = (el, a, b, at, d, fmt) => { const o = { v: a }; el.textContent = fmt(a); tl.fromTo(o, { v: a }, { v: b, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, at); };
    const arc = (el, at, d, a, b, h, ease) => { const o = { p: 0 }; gsap.set(el, { x: a[0], y: a[1] }); tl.fromTo(o, { p: 0 }, { p: 1, duration: d, ease: ease || "power1.inOut", immediateRender: false, onUpdate: () => { const p = o.p; gsap.set(el, { x: a[0] + (b[0] - a[0]) * p, y: a[1] + (b[1] - a[1]) * p - 4 * h * p * (1 - p) }); } }, at); };
    const punch = (at, k, d) => tl.fromTo($("punch"), { scale: 1 }, { scale: k || 1.12, duration: (d || 0.36) / 2, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false, transformOrigin: "50% 55%" }, at);
    const jolt = (at, n, px) => shake($("punch"), at, n || 4, px || 14);
    const whip = (dir) => tl.fromTo($("stage"), { x: dir * 1080, rotation: dir * 2, transformOrigin: "50% 50%" }, { x: 0, rotation: 0, duration: 0.4, ease: "expo.out" }, 0);
    const P = (f, n, at, d, o) => Stickman.pose(tl, f, n, at, d, o);
    const gait = (f, at, d, run, end) => { const n = Math.max(2, Math.round(d * 4)), s = d / n; for (let i = 0; i < n; i++) Stickman.pose(tl, f, run ? "run" : "walk", at + i * s, s, { mirror: i % 2 === 1, ease: "sine.inOut" }); return Stickman.pose(tl, f, end || "stand", at + d, 0.2); };
    const Wk = (f, x0, x1, at, d, end, run) => { mv(f.el, at, [x0, 0], [x1, 0], d, "power1.out", true); return gait(f, at, d, run, end); };
    const hop = (f, at, n, h) => tl.fromTo(f.el, { y: 0 }, { y: -(h || 50), duration: 0.18, ease: "power2.out", yoyo: true, repeat: (n || 1) * 2 - 1, immediateRender: false }, at);


    const E = 5.4;
    const bg = Stickman.background($("bg"), "park", { focusX: 900 });
    Stickman.enter(tl, $("stage"), "fade", { at: 0, duration: 0.25 });
    Stickman.camera(tl, $("cam"), { at: 0, duration: E, preset: "pan-right" });
    Stickman.parallax(tl, bg, { x: 140, at: 0, duration: E });
    const you = Stickman.mount($("you"), { pose: "sit", scale: 1.8, ground: 1440 + 67 * 1.8 });
    Stickman.breathe(tl, you, 0, E);
    popin($("t1"), 0.15, -6); popin($("chart"), 0.5, 20); bob($("chart"), 0.9, 3, 14, 0.25);
    popin($("pot"), 0.3, -15);
    // uang keluar ke stickman, pot terisi lagi
    popin($("c0"), 1.60, 0, 0.1); arc($("c0"), 1.60, 0.5, [0, 0], [-420, -60], 200, "power1.inOut"); popout($("c0"), 2.10, 0.1);
    popin($("c1"), 2.15, 0, 0.1); arc($("c1"), 2.15, 0.5, [0, 0], [-420, -60], 200, "power1.inOut"); popout($("c1"), 2.65, 0.1);
    popin($("c2"), 2.70, 0, 0.1); arc($("c2"), 2.70, 0.5, [0, 0], [-420, -60], 200, "power1.inOut"); popout($("c2"), 3.20, 0.1);
    popin($("c3"), 3.25, 0, 0.1); arc($("c3"), 3.25, 0.5, [0, 0], [-420, -60], 200, "power1.inOut"); popout($("c3"), 3.75, 0.1);
    popin($("c4"), 3.80, 0, 0.1); arc($("c4"), 3.80, 0.5, [0, 0], [-420, -60], 200, "power1.inOut"); popout($("c4"), 4.30, 0.1);
    popin($("c5"), 4.35, 0, 0.1); arc($("c5"), 4.35, 0.5, [0, 0], [-420, -60], 200, "power1.inOut"); popout($("c5"), 4.85, 0.1);
    drop($("d0"), 1.85, 600, 0.4); popout($("d0"), 2.30, 0.12); pulse($("pot"), 2.25, 1.08);
    drop($("d1"), 2.55, 600, 0.4); popout($("d1"), 3.00, 0.12); pulse($("pot"), 2.95, 1.08);
    drop($("d2"), 3.25, 600, 0.4); popout($("d2"), 3.70, 0.12); pulse($("pot"), 3.65, 1.08);
    drop($("d3"), 3.95, 600, 0.4); popout($("d3"), 4.40, 0.12); pulse($("pot"), 4.35, 1.08);
    popin($("sp"), 2.0, 30); wob($("sp"), 2.3, 6, 15, 0.2);
    hop(you, 2.05, 1, 30); hop(you, 3.15, 1, 30); wob(you.el, 2.5, 2, 3, 0.15);
    // kalender berlari 1 -> 30
    popin($("cal"), 1.7, 10);
    count($("yr"), 1, 30, 1.95, 1.8, (v) => String(Math.round(v)));
    tl.fromTo($("cal"), { rotation: -4 }, { rotation: 4, duration: 0.09, ease: "none", yoyo: true, repeat: 19, immediateRender: false, transformOrigin: "50% 0%" }, 1.95);
    popout($("t1"), 3.5, 0.12); slam($("t2"), 3.58, -3); punch(3.6, 1.1); pulse($("cal"), 3.8, 1.15);
    hop(you, 3.9, 2, 35);
    // si bintang mengintip dari balik kalender
    tl.fromTo($("ast"), { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.25, ease: "power2.out" }, 4.5);
    wob($("ast"), 4.75, 2, 20, 0.1);
    window.__timelines["s05"] = tl;
  })();
  </script>
