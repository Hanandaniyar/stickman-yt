<template>
  <style>
    #root { position: absolute; inset: 0; background: #FAF7F0; overflow: hidden; }
    #s52-f { position: absolute; left: 96px; top: 100px; width: 1728px; text-align: center; font-size: 80px; line-height: 1.1; font-weight: 900; color: #111111;  }
    #s52-c0 { position: absolute; left: 600px; top: 360px; }
    #s52-arr { position: absolute; left: 840px; top: 380px; width: 200px; text-align: center; font-size: 130px; line-height: 1.1; font-weight: 900; color: #111111;  }
    #s52-c1 { position: absolute; left: 1060px; top: 360px; }
    #s52-c2 { position: absolute; left: 1260px; top: 360px; }
    #s52-guy { position: absolute; left: 270px; top: 556px; }
  </style>
  <div id="root" data-composition-id="s52" data-width="1920" data-height="1080">
    <div id="s52-f" class="clip sm-title" data-start="0" data-duration="30">72 ÷ rate = <span class="sm-accent">years to double</span></div>
    <div id="s52-c0" class="clip sm-prop" data-start="0" data-duration="30"></div>
    <div id="s52-arr" class="clip sm-title" data-start="0" data-duration="30">→</div>
    <div id="s52-c1" class="clip sm-prop" data-start="0" data-duration="30"></div>
    <div id="s52-c2" class="clip sm-prop" data-start="0" data-duration="30"></div>
    <div id="s52-guy" class="clip sm-figure" data-start="0" data-duration="30"></div>
  </div>
  <script>
  (function () {
    const tl = gsap.timeline({ paused: true });
    const $ = (n) => document.getElementById("s52-" + n);
    const pop = (el, at, d) => tl.fromTo(el, { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: d || 0.45, ease: "back.out(2)" }, at);
    const rise = (el, at) => tl.fromTo(el, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at);
    const fade = (el, at, d) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: d || 0.5, ease: "power1.out" }, at);
    const out = (el, at, to) => tl.fromTo(el, { opacity: 1 }, { opacity: to || 0, duration: 0.4, ease: "power1.in", immediateRender: false }, at);
    const growX = (el, at, d) => tl.fromTo(el, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: d || 0.8, ease: "power2.out" }, at);
    const growY = (el, at, d) => tl.fromTo(el, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: d || 0.8, ease: "power2.out" }, at);
    const draw = (el, at, d) => tl.fromTo(el, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d || 1, ease: "power1.inOut" }, at);
    const comma = (v) => Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    const count = (el, a, b, at, d, fmt) => { const o = { v: a }; el.textContent = fmt(a); tl.fromTo(o, { v: a }, { v: b, duration: d, ease: "power2.out", onUpdate: () => { el.textContent = fmt(o.v); } }, at); };
    const gait = (fig, at, d, run, end) => { const n = Math.max(2, Math.round(d * 3)), s = d / n; for (let i = 0; i < n; i++) Stickman.pose(tl, fig, run ? "run" : "walk", at + i * s, s, { mirror: i % 2 === 1, ease: "sine.inOut" }); return Stickman.pose(tl, fig, end || "stand", at + d, 0.2); };
    const c0 = Stickman.prop($("c0"), "coin", { size: 180 });
    const c1 = Stickman.prop($("c1"), "coin", { size: 180 });
    const c2 = Stickman.prop($("c2"), "coin", { size: 180 });
    const guy = Stickman.mount($("guy"), { pose: "explain", scale: 0.7 });
    Stickman.breathe(tl, guy, 0, 30);
    fade($("f"), 0.3);
    Stickman.pose(tl, guy, "explain", 0.5);
    pop(c0, 3.2);
    fade($("arr"), 6.4);
    pop(c1, 6.8);
    pop(c2, 7.1);
    window.__timelines["s52"] = tl;
  })();
