name: Pipeline
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Teruskan baris notify ke Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run sty notify-commit

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pending.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Cari permintaan render/upload
        id: pending
        run: echo "matrix=$(uv run sty ci-pending)" >> "$GITHUB_OUTPUT"

  work:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: ep-${{ matrix.episode }}
      cancel-in-progress: false
    env:
      HYPERFRAMES_NO_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      EP: ${{ matrix.episode }}
      HYPERFRAMES_PYTHON: /home/runner/kokoro-venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - name: Pasang FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Pasang HyperFrames
        run: npm ci --no-audit --no-fund && npx --no-install hyperframes browser ensure
      - name: Pasang Kokoro (suara narasi)
        run: uv venv -q /home/runner/kokoro-venv --python 3.12 && uv pip install -q --python /home/runner/kokoro-venv/bin/python kokoro-onnx soundfile
      - name: Cache model suara dan transkripsi
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hyperframes
            ~/.cache/whisper
          key: hf-models-portable-${{ hashFiles('package-lock.json') }}
      - name: Bangun whisper-cli portabel (bukan -march=native, agar cache aman di CPU runner lain)
        run: |
          D=~/.cache/hyperframes/whisper/whisper.cpp
          if [ ! -x "$D/build/bin/whisper-cli" ]; then
            rm -rf "$D" && mkdir -p ~/.cache/hyperframes/whisper
            git clone -q --depth 1 https://github.com/ggml-org/whisper.cpp.git "$D"
            cmake -S "$D" -B "$D/build" -DGGML_NATIVE=OFF -DCMAKE_BUILD_TYPE=Release > /dev/null
            cmake --build "$D/build" --config Release -j > /dev/null
          fi
      - name: Identitas git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Render
        if: matrix.request == 'render'
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run sty ci-run "$EP" render
      - name: Upload ke YouTube
        if: matrix.request == 'upload'
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: uv run sty ci-run "$EP" upload
      - name: Bersihkan permintaan macet
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run sty ci-fail "$EP"
